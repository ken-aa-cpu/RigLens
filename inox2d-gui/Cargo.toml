[package]
name = "inox2d-gui"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/ken-aa-cpu/RigLens"
readme = "../README.md"
keywords = ["inochi2d", "vtuber", "egui", "rigging", "studio"]
categories = ["gui", "graphics"]
description = "Craft-style native Rust desktop studio (egui) for RigLens / inox2d-mcp"

[dependencies]
inox2d = { path = "../inox2d" }
inox2d-mcp = { path = "../inox2d-mcp" }
riglens-booster = { path = "../riglens-booster" }
riglens-stage-gl = { path = "../riglens-stage-gl" }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
clap = { version = "4.5", features = ["derive"] }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
json = "0.12.4"
