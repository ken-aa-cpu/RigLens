[package]
name = "riglens-mcp"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/ken-aa-cpu/RigLens"
readme = "../README.md"
keywords = ["riglens", "vtuber", "mcp", "psd", "rigging"]
categories = ["command-line-utilities", "graphics"]
description = "Headless rigging engine, 10-point auditor, PSD pipeline, CLI, and MCP server/client companion for RigLens"

[dependencies]
riglens-core = { path = "../riglens-core" }
riglens-format = { path = "../riglens-format" }
riglens-booster = { path = "../riglens-booster" }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
json = "0.12.4"
serde_json = "1"
clap = { version = "4.1", features = ["derive"] }
