[package]
name = "riglens-stage-gl"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/ken-aa-cpu/RigLens"
readme = "../README.md"
keywords = ["opengl", "egui", "inochi2d", "vtuber", "graphics"]
