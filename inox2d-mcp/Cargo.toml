[package]
name = "inox2d-mcp"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/ken-aa-cpu/RigLens"
readme = "../README.md"
keywords = ["inochi2d", "vtuber", "mcp", "psd", "rigging"]
categories = ["command-line-utilities", "graphics"]
description = "Creator rigging engine, headless renderer, CLI, and MCP server/client companion for RigLens / inox2d"

[dependencies]
inox2d = { path = "../inox2d" }
riglens-format = { path = "../riglens-format" }
riglens-booster = { path = "../riglens-booster" }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
json = "0.12.4"
serde_json = "1"
clap = { version = "4.1", features = ["derive"] }
