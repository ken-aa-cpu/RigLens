[package]
name = "riglens-booster"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "Dual-channel GPU co-processor & advanced physics booster (VTube Studio Port 8001 + Windows Spout2 zero-copy bridge) for RigLens and Live2D"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
wgpu = "24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
